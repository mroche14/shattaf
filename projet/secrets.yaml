- nom: APP_NAME
  usage: Nom de l'application affiché/loggé côté API (racine .env.example).
  environnements: [dev, staging, prod]
- nom: APP_VERSION
  usage: Version applicative exposée par l'API.
  environnements: [dev, staging, prod]
- nom: DEBUG
  usage: Active le mode debug FastAPI (stack traces détaillées) — doit être faux en prod.
  environnements: [dev, staging, prod]
- nom: ENVIRONMENT
  usage: Nom de l'environnement courant (development/staging/production), lu par la config applicative.
  environnements: [dev, staging, prod]
- nom: HOST
  usage: Adresse d'écoute du serveur uvicorn.
  environnements: [dev, staging, prod]
- nom: PORT
  usage: Port d'écoute de l'API (8000 par défaut en local, 8010 en dev selon CLAUDE.md).
  environnements: [dev, staging, prod]
- nom: DATABASE_URL
  usage: Chaîne de connexion PostgreSQL asyncpg (SQLModel/Alembic) — accès complet à la base applicative.
  environnements: [dev, staging, prod]
- nom: JWT_SECRET_KEY
  usage: Clé de signature des tokens JWT d'authentification — sa fuite permet de forger n'importe quel token.
  environnements: [dev, staging, prod]
- nom: JWT_ALGORITHM
  usage: Algorithme de signature JWT (HS256).
  environnements: [dev, staging, prod]
- nom: JWT_ACCESS_TOKEN_EXPIRE_MINUTES
  usage: Durée de vie du token d'accès.
  environnements: [dev, staging, prod]
- nom: JWT_REFRESH_TOKEN_EXPIRE_DAYS
  usage: Durée de vie du token de rafraîchissement.
  environnements: [dev, staging, prod]
- nom: CORS_ORIGINS
  usage: Liste des origines autorisées à appeler l'API (les 3 frontends en dev).
  environnements: [dev, staging, prod]
- nom: STRIPE_SECRET_KEY
  usage: >-
    Clé secrète Stripe pour créer paiements et comptes Stripe Connect — accès
    financier direct. À faire tourner si le mode test (sk_test_...) bascule
    en clé live avant la mise en prod.
  environnements: [dev, staging, prod]
- nom: STRIPE_WEBHOOK_SECRET
  usage: Secret de vérification de signature des webhooks Stripe (paiements/statuts de compte Connect).
  environnements: [dev, staging, prod]
- nom: STRIPE_PLATFORM_FEE_PERCENT
  usage: Pourcentage de commission plateforme prélevé sur chaque paiement split Stripe Connect.
  environnements: [dev, staging, prod]
- nom: GOOGLE_MAPS_API_KEY
  usage: Géocodage et cartographie (matching géographique, carte de couverture admin).
  environnements: [dev, staging, prod]
- nom: BREVO_API_KEY
  usage: Envoi d'emails/SMS transactionnels (Brevo/Sendinblue) — confirmations, notifications.
  environnements: [dev, staging, prod]
- nom: BREVO_SENDER_EMAIL
  usage: Adresse expéditrice des emails envoyés via Brevo.
  environnements: [dev, staging, prod]
- nom: BREVO_SENDER_NAME
  usage: Nom d'expéditeur affiché sur les emails Brevo.
  environnements: [dev, staging, prod]
- nom: S3_ENDPOINT_URL
  usage: Point de terminaison S3/Cloudflare R2 pour le stockage des photos (missions, produits).
  environnements: [dev, staging, prod]
- nom: S3_ACCESS_KEY_ID
  usage: Identifiant de clé d'accès au bucket S3/R2.
  environnements: [dev, staging, prod]
- nom: S3_SECRET_ACCESS_KEY
  usage: Clé secrète d'accès au bucket S3/R2 — donne l'écriture/lecture complète du stockage fichiers.
  environnements: [dev, staging, prod]
- nom: S3_BUCKET_NAME
  usage: Nom du bucket S3/R2 utilisé pour les uploads (photos missions, produits).
  environnements: [dev, staging, prod]
- nom: S3_PUBLIC_URL
  usage: URL publique de base pour servir les fichiers uploadés.
  environnements: [dev, staging, prod]
- nom: SERVICE_ZONE_POSTAL_PREFIX
  usage: Préfixe postal de la zone de service par défaut (971 = Guadeloupe).
  environnements: [dev, staging, prod]
- nom: SERVICE_ZONE_COORDS_CENTER
  usage: Coordonnées du centre de la zone de service par défaut, utilisées par le matching géographique.
  environnements: [dev, staging, prod]
- nom: SERVICE_ZONE_RADIUS_KM
  usage: Rayon en km de la zone de service par défaut.
  environnements: [dev, staging, prod]
